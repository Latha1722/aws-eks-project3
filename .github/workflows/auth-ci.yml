name: Auth Service CI
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'backend/microservices/auth-service/**'
env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  IMAGE_NAME: auth-service
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - run: |
          aws ecr get-login-password --region $AWS_REGION | \
          docker login --username AWS --password-stdin $ECR_REGISTRY

      - run: |
          docker build -t $IMAGE_NAME:${{ github.sha }} ./backend/microservices/auth-service

      - run: |
          docker tag $IMAGE_NAME:${{ github.sha }} $ECR_REGISTRY/$IMAGE_NAME:${{ github.sha }}
          docker tag $IMAGE_NAME:${{ github.sha }} $ECR_REGISTRY/$IMAGE_NAME:latest

      - run: |
          docker push $ECR_REGISTRY/$IMAGE_NAME:${{ github.sha }}
          docker push $ECR_REGISTRY/$IMAGE_NAME:latest        

      - name: Update image tag in deployment
        run: |
          sed -i "s|image: .*auth-service.*|image: $ECR_REGISTRY/$IMAGE_NAME:${{ github.sha }}|" \
            k8s-deployments/auth-service/deployment.yaml
          git config user.email "ci@github.com"
          git config user.name "GitHub Actions"
          git add k8s-deployments/auth-service/deployment.yaml
          git commit -m "ci: update auth-service image to ${{ github.sha }}"
          git pull --rebase origin main
          git push

