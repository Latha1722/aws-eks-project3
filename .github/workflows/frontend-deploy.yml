name: Build and Deploy Frontend

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'k8s-deployments/**'

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $EKS_CLUSTER_NAME

      # 🔥 Install Helm
      - name: Install Helm
        uses: azure/setup-helm@v4

      # 🔥 Add Helm Repo
      - name: Add EKS Helm Repo
        run: |
          helm repo add eks https://aws.github.io/eks-charts
          helm repo update

      # 🔥 Install or Upgrade ALB Controller
      - name: Install AWS Load Balancer Controller
        run: |
          helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
            -n kube-system \
            --create-namespace \
            --set clusterName=${{ secrets.EKS_CLUSTER_NAME }} \
            --set serviceAccount.create=true \
            --set serviceAccount.name=aws-load-balancer-controller \
            --set enableCertManager=false

      # 🔥 WAIT FOR CONTROLLER (VERY IMPORTANT)
      - name: Wait for Load Balancer Controller
        run: |
          kubectl rollout status deployment aws-load-balancer-controller -n kube-system --timeout=120s

      # 🚀 Build & Push Image
      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION | \
          docker login --username AWS --password-stdin \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com

      - name: Build Docker image
        run: docker build -t frontend ./frontend

      - name: Tag Docker image
        run: |
          docker tag frontend:latest \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/frontend:latest

      - name: Push Docker image
        run: |
          docker push \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/frontend:latest

      # 🚀 Deploy Kubernetes Resources
      - name: Deploy Namespace & Services
        run: |
          kubectl apply -f k8s-deployments/namespace.yaml
          kubectl apply -f k8s-deployments/frontend/

      - name: Apply Ingress
        run: |
          kubectl apply -f k8s-deployments/ingress.yaml -n mern-microservices

      - name: Check Deployment Status
        run: |
          echo "=== Pods ==="
          kubectl get pods -n mern-microservices

          echo "=== Ingress ==="
          kubectl get ingress -n mern-microservices
