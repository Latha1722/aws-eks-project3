name: Frontend CI

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  IMAGE_NAME: frontend

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION | \
          docker login --username AWS --password-stdin $ECR_REGISTRY

      - name: Build Docker image
        run: |
          docker build -t $IMAGE_NAME:${{ github.sha }} ./frontend

      - name: Tag image
        run: |
          docker tag $IMAGE_NAME:${{ github.sha }} \
          $ECR_REGISTRY/$IMAGE_NAME:${{ github.sha }}

      - name: Push image
        run: |
          docker push $ECR_REGISTRY/$IMAGE_NAME:${{ github.sha }}

      - name: Update image tag in deployment
        run: |
          sed -i "s|image: .*auth-service.*|image: $ECR_REGISTRY/$IMAGE_NAME:${{ github.sha }}|" \
            k8s-deployments/auth-service/deployment.yaml
          git config user.email "ci@github.com"
          git config user.name "GitHub Actions"
          git add k8s-deployments/auth-service/deployment.yaml
          git commit -m "ci: update auth-service image to ${{ github.sha }}"
          git push

