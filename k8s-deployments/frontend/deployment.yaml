apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: mern-dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend-container
          image: 466825169909.dkr.ecr.ap-south-1.amazonaws.com/frontend:5e2dbca733f79a8bd138a87b5490b53c08e56105
          ports:
            - containerPort: 3000
