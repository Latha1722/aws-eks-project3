apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: mern-dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend-container
          image: 466825169909.dkr.ecr.ap-south-1.amazonaws.com/frontend:e81de7a6356b15bf5724571d1964def37d57a5f8
          ports:
            - containerPort: 3000
