apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-deployment
  namespace: mern-dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth-container
          image: 466825169909.dkr.ecr.ap-south-1.amazonaws.com/auth-service:ac0ffb551b02c22e9b94f4f6ea8198dad1ee06df
          ports:
            - containerPort: 5001
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: MONGO_URI
